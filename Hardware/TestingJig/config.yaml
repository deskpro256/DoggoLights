# DoggoLights testing jig configuration.

firmware:
  # Pulled from the repo's latest/latest.txt manifest.
  latest_manifest_url: "https://raw.githubusercontent.com/deskpro256/DoggoLights/main/Firmware/latest/latest.txt"
  binary_url:          "https://raw.githubusercontent.com/deskpro256/DoggoLights/main/Firmware/latest/firmware.bin"
  factory_url:         "https://raw.githubusercontent.com/deskpro256/DoggoLights/main/Firmware/latest/firmware-factory.bin"
  cache_dir:           "./.cache/firmware"

esptool:
  chip:        "esp32c3"
  baud:        921600
  flash_addr:  "0x0"            # factory merged image -> 0x0
  before:      "default_reset"
  after:       "hard_reset"

rpc:
  baud:           115200
  read_timeout_s: 2.0
  unlock_token:   "doggo-mfg-2026"   # DL_RPC_GLOBAL_TOKEN in app_config.h

usb:
  port_glob: "COM3"

# RPi HAT GPIO assignments (BCM numbering).
gpio:
  boot_pin:        17    # pulls DUT GPIO9 low
  reset_pin:       27    # pulls DUT EN low
  button_solenoid: 22    # presses DUT button
  dut_power:       23    # optional USB power switch

i2c:
  bus:            1
  ina228_addr:    0x40
  lux_sensor_1:   0x44   # over LED1
  lux_sensor_2:   0x45   # over LED2

# Pass/fail thresholds.
thresholds:
  ambient_lux_max:        30
  lit_lux_min_delta:      150
  sleep_current_ua_max:   200
  idle_current_ma_max:    25
  static_current_ma_max:  120

wifi:
  ap_ssid_prefix: "DoggoLights"
  ap_password:    ""          # firmware AP is open
  nm_connection:  "doggolights-test"

server:
  host: "0.0.0.0"
  port: 8080

database:
  path: "./results.sqlite3"
